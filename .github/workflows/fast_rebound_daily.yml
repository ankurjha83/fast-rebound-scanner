name: Fast Rebound Daily Scanner

on:
  schedule:
    # 00:10 UTC is 09:10 Asia/Seoul. The app-level NYSE calendar decides
    # whether a new completed U.S. session exists (including holidays).
    - cron: "10 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fast-rebound-production-state
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Restore market-data cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: fast-rebound-market-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            fast-rebound-market-data-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_daily_scan.py

      - name: Persist non-secret prospective state
        if: success() || failure()
        run: |
          git config user.name "fast-rebound-bot"
          git config user.email "fast-rebound-bot@users.noreply.github.com"
          git add -f state outputs/daily outputs/prospective
          git diff --cached --quiet || git commit -m "chore: persist Fast Rebound state [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Archive non-secret run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-rebound-${{ github.run_id }}
          path: |
            state/run_history/
            state/recommendation_history/
            outputs/daily/
            outputs/prospective/
          retention-days: 90
